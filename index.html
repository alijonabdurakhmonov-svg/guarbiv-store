<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUARBIV — WE ARE DIFFERENT</title>
<style>
:root{--ink:#11110f;--paper:#f2eee6;--deep:#e5ded2;--line:#cbc3b7;--muted:#706b63;--navy:#1c2835}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(255,255,255,.65),transparent 24%),repeating-linear-gradient(0deg,rgba(60,50,38,.018) 0 1px,transparent 1px 5px),var(--paper);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 34px;border-bottom:1px solid var(--line);background:rgba(242,238,230,.94);backdrop-filter:blur(10px)}.brand,.wordmark{font-family:Arial Black,Arial,sans-serif;font-weight:900;letter-spacing:-.075em;transform:scaleX(.92);transform-origin:left}.brand{font-size:25px}.nav{display:flex;gap:30px;font-size:11px;font-weight:700;letter-spacing:.14em}.menu{display:flex;gap:16px;align-items:center;font-size:11px;letter-spacing:.12em}.bag{border:1px solid var(--ink);padding:9px 13px}
.hero{min-height:calc(100vh - 67px);padding:28px 34px 34px;display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px solid var(--line)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.16em}.hero-center{padding:8vh 0 5vh}.hero h1{margin:0;font-family:Arial Black,Arial,sans-serif;font-weight:900;font-size:clamp(76px,19vw,270px);letter-spacing:-.105em;line-height:.76;transform:scaleX(.94);transform-origin:left}.sub{margin-top:32px;max-width:390px;font-size:18px;line-height:1.35}.hero-bottom{display:flex;justify-content:space-between;align-items:end;gap:30px}.cta{border:1px solid var(--ink);padding:16px 22px;font-size:11px;font-weight:700;letter-spacing:.14em}.cta:hover{background:var(--ink);color:var(--paper)}.scroll{font-size:10px;color:var(--muted);letter-spacing:.16em}
.section{padding:100px 34px;border-bottom:1px solid var(--line)}.kicker{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted);margin-bottom:17px}.title{font-size:clamp(40px,6vw,88px);line-height:.9;letter-spacing:-.075em;margin:0 0 48px;font-weight:800}.drop-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.drop{min-height:570px;padding:22px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between}.drop.a{background:var(--navy);color:var(--paper)}.drop.b{background:#cfc6b9}.label{font-size:11px;font-weight:700;letter-spacing:.14em;z-index:2}.num{font-size:70px;font-weight:900;opacity:.18}
.garment{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52%;height:60%;border:2px solid currentColor}.garment:before{content:"";position:absolute;left:50%;top:-10%;transform:translateX(-50%);width:30%;height:12%;border:2px solid currentColor;border-bottom:0;border-radius:50% 50% 0 0}.garment:after{content:"GUARBIV";position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scaleX(.88);font-family:Arial Black,Arial,sans-serif;font-size:clamp(20px,3vw,44px);letter-spacing:-.08em;white-space:nowrap}.a .garment{color:#d9d4cb}.b .garment{width:48%;height:52%;color:#1c1b18}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.product{border:1px solid var(--line);background:rgba(255,255,255,.13)}.visual{height:430px;position:relative;display:flex;align-items:center;justify-content:center;background:#ded7cc}.product:nth-child(2) .visual{background:#d2d8d2}.product:nth-child(3) .visual{background:#d7d0c4}.product .garment{width:48%;height:57%;color:var(--ink)}.product:nth-child(3) .garment{height:30%;width:55%;border-radius:50% 50% 18% 18%}.info{padding:17px;display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:700;letter-spacing:.08em}.info span:last-child{color:var(--muted);font-weight:400}
.position{background:var(--ink);color:var(--paper);padding:110px 34px}.posgrid{display:grid;grid-template-columns:.7fr 1.3fr;gap:40px}.position p{font-size:clamp(38px,6.5vw,100px);line-height:.92;letter-spacing:-.08em;margin:0}.note{max-width:300px;font-size:15px;line-height:1.5;color:#c7c1b8}
.editorial{display:grid;grid-template-columns:1fr 1fr;min-height:620px;border-bottom:1px solid var(--line)}.edimage{background:linear-gradient(135deg,#a9a096,#dcd5ca);display:flex;align-items:center;justify-content:center}.edimage .wordmark{font-size:clamp(55px,9vw,130px)}.edcopy{padding:70px 34px;display:flex;flex-direction:column;justify-content:space-between}.edcopy h3{font-size:clamp(42px,5vw,72px);line-height:.93;letter-spacing:-.07em;margin:0}.newsletter{padding:70px 34px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:40px;align-items:end}.newsletter h2{margin:0;font-size:clamp(35px,5vw,68px);line-height:.9;letter-spacing:-.07em}.form{display:flex;border-bottom:1px solid var(--ink);min-width:min(430px,100%)}.form input{border:0;background:transparent;padding:15px 0;width:100%;font:inherit;outline:none}.form button{border:0;background:transparent;font-size:10px;font-weight:700;letter-spacing:.14em}.footer{padding:30px 34px;background:var(--ink);color:var(--paper);display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;font-size:10px;letter-spacing:.13em}.footer div:nth-child(2){text-align:center}.footer div:last-child{text-align:right}
@media(max-width:760px){.top{padding:17px 18px}.brand{font-size:22px}.nav{display:none}.menu>span{display:none}.hero,.section{padding-left:18px;padding-right:18px}.hero{min-height:82vh}.hero h1{font-size:24vw}.hero-bottom{flex-direction:column;align-items:flex-start}.drop-grid,.editorial,.posgrid{grid-template-columns:1fr}.drop{min-height:470px}.products{grid-template-columns:1fr}.visual{height:390px}.position{padding:80px 18px}.edcopy{padding:50px 18px;min-height:500px}.newsletter{padding:55px 18px;flex-direction:column;align-items:flex-start}.form{min-width:100%}.footer{padding:28px 18px;grid-template-columns:1fr}.footer div:nth-child(2),.footer div:last-child{text-align:left}}
</style>


<style id="guarbiv-ui">
.user-actions{display:flex;gap:14px;align-items:center}
.user-btn{border:0;background:transparent;padding:6px 0;font:inherit;font-size:11px;font-weight:700;letter-spacing:.12em;cursor:pointer}
.lang-btn{border-bottom:1px solid var(--ink)}
.account-drawer{position:fixed;inset:0;z-index:50;display:none}
.account-drawer.open{display:block}
.account-overlay{position:absolute;inset:0;background:rgba(17,17,15,.44)}
.account-panel{position:absolute;left:0;top:0;height:100%;width:min(440px,94vw);background:var(--paper);padding:30px 28px;overflow:auto;box-shadow:18px 0 70px rgba(0,0,0,.16)}
.account-close{position:absolute;right:23px;top:18px;background:transparent;border:0;font-size:28px;cursor:pointer}
.account-title{font-size:clamp(42px,7vw,70px);line-height:.84;letter-spacing:-.075em;font-weight:800;margin:18px 0 28px}
.account-status{font-size:12px;line-height:1.5;color:var(--muted);max-width:340px}
.account-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:28px 0}
.account-tabs button{border:0;border-right:1px solid var(--line);background:transparent;padding:14px 7px;font-size:10px;font-weight:700;letter-spacing:.1em;cursor:pointer}
.account-tabs button:last-child{border-right:0}
.account-view{display:none}
.account-view.active{display:block}
.field{display:grid;gap:8px;margin:12px 0}
.field label{font-size:10px;letter-spacing:.13em;color:var(--muted)}
.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);background:transparent;font:inherit}
.primary-btn{width:100%;padding:14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;letter-spacing:.13em;cursor:pointer}
.lang-picker{display:flex;gap:8px;margin:18px 0}
.lang-picker button{flex:1;border:1px solid var(--line);padding:12px;background:transparent;font-size:10px;font-weight:700;letter-spacing:.1em;cursor:pointer}
.lang-picker button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mobile-menu-btn{display:none;border:0;background:transparent;font-size:20px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);z-index:60;background:var(--ink);color:var(--paper);padding:13px 17px;font-size:10px;letter-spacing:.1em;transition:transform .22s}
.toast.show{transform:translate(-50%,0)}
@media(max-width:760px){
  .user-actions{display:none}.mobile-menu-btn{display:block}
  .top{padding:17px 18px}
}
</style>
<style>
.ai-launch{position:fixed;right:22px;bottom:22px;z-index:70;border:1px solid var(--ink);background:var(--paper);padding:13px 16px;font-size:10px;font-weight:800;letter-spacing:.12em;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.ai-panel{position:fixed;right:22px;bottom:76px;width:min(380px,calc(100vw - 32px));height:500px;z-index:70;background:var(--paper);border:1px solid var(--ink);display:none;flex-direction:column;box-shadow:8px 8px 0 var(--ink)}
.ai-panel.open{display:flex}.ai-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.12em}.ai-head button{border:0;background:transparent;font-size:20px;cursor:pointer}.ai-chat{flex:1;padding:16px;overflow:auto;font-size:13px;line-height:1.45}.ai-msg{margin-bottom:12px;max-width:88%;padding:10px 12px;border:1px solid var(--line)}.ai-msg.user{margin-left:auto;background:var(--ink);color:var(--paper);border-color:var(--ink)}.ai-input{display:flex;border-top:1px solid var(--line)}.ai-input input{flex:1;border:0;background:transparent;padding:15px;outline:0;font:inherit}.ai-input button{border:0;border-left:1px solid var(--line);background:transparent;padding:0 14px;font-size:10px;font-weight:800;cursor:pointer}
</style></head><body>
<!-- GUARBIV simple account + language system -->
<div class="account-drawer" id="accountDrawer">
  <div class="account-overlay" id="accountOverlay"></div>
  <aside class="account-panel" aria-label="Account">
    <button class="account-close" id="accountClose" aria-label="Close">×</button>
    <div class="kicker" data-i18n="account.kicker">ACCOUNT</div>
    <h2 class="account-title" data-i18n="account.title">YOUR<br>GUARBIV.</h2>
    <div class="account-status" id="accountStatus" data-i18n="account.status">Sign in to keep your details and follow orders.</div>

    <div class="account-tabs">
      <button data-tab="signin" data-i18n="account.signin">SIGN IN</button>
      <button data-tab="orders" data-i18n="account.orders">ORDERS</button>
      <button data-tab="profile" data-i18n="account.profile">PROFILE</button>
    </div>

    <div class="account-view active" id="tab-signin">
      <div class="field"><label data-i18n="account.email">EMAIL</label><input id="email" type="email" autocomplete="email" placeholder="you@email.com"></div>
      <div class="field"><label data-i18n="account.password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="primary-btn" id="signinBtn" data-i18n="account.continue">CONTINUE</button>
    </div>

    <div class="account-view" id="tab-orders">
      <p class="account-status" data-i18n="account.ordersEmpty">No orders yet. Your orders will appear here after checkout is connected.</p>
    </div>

    <div class="account-view" id="tab-profile">
      <div class="field"><label data-i18n="account.name">NAME</label><input id="profileName" type="text"></div>
      <div class="field"><label data-i18n="account.country">COUNTRY</label><select id="profileCountry"><option>United States</option><option>Finland</option><option>China</option><option>Russia</option><option>Tajikistan</option><option>Other</option></select></div>
      <button class="primary-btn" id="saveProfile" data-i18n="account.save">SAVE PROFILE</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>


<script id="guarbiv-tech">
(() => {
  const translations = {
    EN: {
      account:"ACCOUNT", bag:"BAG", close:"×",
      kicker:"ACCOUNT", title:"YOUR<br>GUARBIV.",
      status:"Sign in to keep your details and follow orders.",
      signin:"SIGN IN", orders:"ORDERS", profile:"PROFILE",
      email:"EMAIL", password:"PASSWORD", cont:"CONTINUE",
      empty:"No orders yet. Your orders will appear here after checkout is connected.",
      name:"NAME", country:"COUNTRY", save:"SAVE PROFILE",
      saved:"PROFILE SAVED", needEmail:"ENTER YOUR EMAIL", signed:"DETAILS SAVED"
    },
    RU: {
      account:"АККАУНТ", bag:"КОРЗИНА", close:"×",
      kicker:"АККАУНТ", title:"ВАШ<br>GUARBIV.",
      status:"Войдите, чтобы сохранять данные и отслеживать заказы.",
      signin:"ВОЙТИ", orders:"ЗАКАЗЫ", profile:"ПРОФИЛЬ",
      email:"EMAIL", password:"ПАРОЛЬ", cont:"ПРОДОЛЖИТЬ",
      empty:"Заказов пока нет. Здесь они появятся после подключения оформления заказа.",
      name:"ИМЯ", country:"СТРАНА", save:"СОХРАНИТЬ ПРОФИЛЬ",
      saved:"ПРОФИЛЬ СОХРАНЁН", needEmail:"ВВЕДИТЕ EMAIL", signed:"ДАННЫЕ СОХРАНЕНЫ"
    }
  };

  let lang = localStorage.getItem("guarbiv_lang") || "EN";
  const $ = (id) => document.getElementById(id);
  const drawer=$("accountDrawer"), toastEl=$("toast");

  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add("show");
    setTimeout(()=>toastEl.classList.remove("show"),2200);
  }
  function openDrawer(){ drawer.classList.add("open"); }
  function closeDrawer(){ drawer.classList.remove("open"); }

  function setText(id,text){ const el=$(id); if(el) el.textContent=text; }
  function applyLanguage(){
    const t=translations[lang];
    const languageBtn=$("languageBtn");
    if(languageBtn) languageBtn.textContent=lang;
    document.documentElement.lang=lang.toLowerCase();
    document.querySelector('[data-i18n="account.kicker"]').textContent=t.kicker;
    document.querySelector('[data-i18n="account.title"]').innerHTML=t.title;
    document.querySelector('[data-i18n="account.status"]').textContent=t.status;
    document.querySelector('[data-i18n="account.signin"]').textContent=t.signin;
    document.querySelector('[data-i18n="account.orders"]').textContent=t.orders;
    document.querySelector('[data-i18n="account.profile"]').textContent=t.profile;
    document.querySelector('[data-i18n="account.email"]').textContent=t.email;
    document.querySelector('[data-i18n="account.password"]').textContent=t.password;
    document.querySelector('[data-i18n="account.continue"]').textContent=t.cont;
    document.querySelector('[data-i18n="account.ordersEmpty"]').textContent=t.empty;
    document.querySelector('[data-i18n="account.name"]').textContent=t.name;
    document.querySelector('[data-i18n="account.country"]').textContent=t.country;
    document.querySelector('[data-i18n="account.save"]').textContent=t.save;
  }

  $("accountBtn")?.addEventListener("click",openDrawer);
  $("accountClose")?.addEventListener("click",closeDrawer);
  $("accountOverlay")?.addEventListener("click",closeDrawer);

  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".account-view").forEach(v=>v.classList.remove("active"));
      const view=$("tab-"+btn.dataset.tab); if(view) view.classList.add("active");
    });
  });

  $("languageBtn")?.addEventListener("click",()=>{
    lang=lang==="EN"?"RU":"EN";
    localStorage.setItem("guarbiv_lang",lang);
    applyLanguage();
    toast(lang==="RU"?"ЯЗЫК: РУССКИЙ":"LANGUAGE: ENGLISH");
  });

  $("signinBtn")?.addEventListener("click",()=>{
    const email=$("email").value.trim();
    if(!email){ toast(translations[lang].needEmail); return; }
    localStorage.setItem("guarbiv_email",email);
    toast(translations[lang].signed);
  });

  $("saveProfile")?.addEventListener("click",()=>{
    localStorage.setItem("guarbiv_profile_name",$("profileName").value);
    localStorage.setItem("guarbiv_profile_country",$("profileCountry").value);
    toast(translations[lang].saved);
  });

  $("bagBtn")?.addEventListener("click",()=>toast(lang==="RU"?"КОРЗИНА ПОКА ПУСТА":"YOUR BAG IS EMPTY"));
  $("mobileMenuBtn")?.addEventListener("click",openDrawer);
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape")closeDrawer();});

  $("profileName").value=localStorage.getItem("guarbiv_profile_name")||"";
  $("profileCountry").value=localStorage.getItem("guarbiv_profile_country")||"United States";
  applyLanguage();
})();
</script>
<button class="ai-launch" id="aiLaunch">GUARBIV ASSISTANT</button>
<section class="ai-panel" id="aiPanel">
 <div class="ai-head"><span>GUARBIV ASSISTANT / BETA</span><button id="aiClose">×</button></div>
 <div class="ai-chat" id="aiChat"><div class="ai-msg">Hi. I can help you explore DROP 001, products, shipping and the GUARBIV brand. I currently run in local beta mode.</div></div>
 <div class="ai-input"><input id="aiInput" placeholder="Ask GUARBIV..."><button id="aiSend">SEND</button></div>
</section><script>
(()=>{const q=s=>document.querySelector(s),chat=q("#aiChat");const add=(txt,user=false)=>{const d=document.createElement("div");d.className="ai-msg"+(user?" user":"");d.textContent=txt;chat.appendChild(d);chat.scrollTop=chat.scrollHeight};function reply(x){x=x.toLowerCase();if(x.includes("cap")||x.includes("кеп"))return "CAP / OBJECT 001 is currently in development. The next step is to replace the prototype silhouette with our real cap design.";if(x.includes("drop")||x.includes("дроп"))return "DROP 001 is the first GUARBIV direction. Products are still marked IN DEVELOPMENT while the real collection is being built.";if(x.includes("shipping")||x.includes("достав"))return "Shipping is not connected yet. A real store version will need regions, rates, carrier rules and checkout.";return "I am the GUARBIV local beta assistant right now. I can answer about the current collection, products and site direction. A true AI agent needs a secure server-side AI connection, which should be added later rather than exposing an API key inside this HTML file."}q("#aiLaunch").onclick=()=>q("#aiPanel").classList.add("open");q("#aiClose").onclick=()=>q("#aiPanel").classList.remove("open");q("#aiSend").onclick=send;q("#aiInput").addEventListener("keydown",e=>{if(e.key==="Enter")send()});function send(){const i=q("#aiInput"),v=i.value.trim();if(!v)return;add(v,true);i.value="";setTimeout(()=>add(reply(v)),250)}})();
</script></body></html>
